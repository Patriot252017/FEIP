# config/services.yaml
parameters:
    locale: 'en'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    # Автоматическая регистрация сервисов из src/
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            - '../src/Tests/'

    # Регистрация админ-классов Sonata
    App\Admin\:
        resource: '../src/Admin/'
        tags: ['sonata.admin']
        arguments:
            - ~ # Код сервиса (null для автоматической генерации)
            - ~ # Класс сущности (переопределяется в каждом классе)
            - ~ # Контроллер (null для использования стандартного)
            - '@security.password_hasher' # Инжектирование зависимостей для UserAdmin

    # Явная регистрация UserAdmin с кастомными параметрами
    App\Admin\UserAdmin:
        arguments:
            - ~
            - App\Entity\User
            - SonataAdminBundle:CRUD
            - '@security.password_hasher'
        tags:
            - { name: sonata.admin, label: 'Users', manager_type: orm, group: 'User Management' }

    # Настройки для работы с переводами
    Sonata\AdminBundle\Filter\FilterFactory:
        arguments:
            - '@service_container'

    # Регистрация команд (если есть)
    App\Command\:
        resource: '../src/Command/'
        tags: ['console.command']

    # Опционально: кастомный шаблон для SonataAdmin
    sonata.admin.global_template: '@SonataAdmin/standard_layout.html.twig'